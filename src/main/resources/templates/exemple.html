<!DOCTYPE html>
<!--
    exemple.html : modèle de page à DUPLIQUER pour créer un nouvel écran.
    1. Copiez ce fichier dans le bon dossier (utilisateur, admin, auth...).
    2. Changez le titre de l'onglet et le nom de la page ('exemple') ci-dessous.
    3. Écrivez le contenu de la page dans la div "content".
    4. Ajoutez une méthode @GetMapping dans un contrôleur pour afficher la page.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: base(~{::content}, 'PolymathIA - Exemple', 'exemple')}">

<div th:fragment="content" class="pm-content">
    <h1>Titre de la page</h1>
    <p>Contenu de la page.</p>
</div>

</html>
